<div class="background">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-auto topo">

        <div class="card login-card">
          <img src="https://i.ytimg.com/vi/RvBNw8OheyU/maxresdefault.jpg" class="card-img-top" alt="LabStock"/>
          <div class="card-body">
            <h1 class="card-title text-center mb-1">LabStock</h1>
            <h2 class="card-title2 text-center mb-4">Login</h2>

            <div class="mb-3">
              <label class="form-label" for="Usuario">Usuario</label>
              <input type="text" id="Usuario" class="form-control" [(ngModel)]="usuario"/>
            </div>

            <div class="mb-4">
              <label class="form-label" for="Senha">Senha</label>
              <input type="password" id="Senha" class="form-control" [(ngModel)]="senha"/>
            </div>

            <div class="text-center">
              <button type="button" class="btn btn-primary" mdbRipple (click)="logar()">Logar</button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
