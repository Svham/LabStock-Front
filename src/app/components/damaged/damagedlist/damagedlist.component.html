<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Danos</h2>
    <a routerLink="new" class="btn btn-primary" mdbRipple>
      + Registrar Dano
    </a>
  </div>

  <div *ngIf="erro" class="alert alert-danger">{{ erro }}</div>

  <!-- Lista -->
  <div class="table-responsive">
    <table class="table table-hover align-middle">
      <thead class="table-light">
        <tr>
          <th>Data</th>
          <th>Item</th>
          <th>Qtd.</th>
          <th>Aluno</th>
          <th>Laboratorista</th>
          <th>Motivo</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let registro of registros">
          <td>{{ registro.createdAt | date:'dd/MM/yyyy HH:mm' }}</td>
          <td>{{ registro.itemName }}</td>
          <td>{{ registro.quantity }}</td>
          <td>{{ registro.studentName }}</td>
          <td>{{ registro.labName }}</td>
          <td>{{ registro.reason }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Loading / vazio -->
  <div class="text-center my-3">
    <div *ngIf="carregando" class="spinner-border text-primary" role="status"></div>
    <p *ngIf="!carregando && registros.length === 0" class="text-muted">
      Nenhum dano registrado.
    </p>
  </div>
</div>
