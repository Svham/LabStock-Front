<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Usuários</h2>
  </div>

  <div *ngIf="sucesso" class="alert alert-success">{{ sucesso }}</div>
  <div *ngIf="erro" class="alert alert-danger">{{ erro }}</div>

  <!-- Busca -->
  <div class="row mb-4 g-3 align-items-end">
    <div class="col-md-10">
      <label class="form-label" for="filtroBusca">Buscar por nome, e-mail ou perfil</label>
      <input
          type="text"
          id="filtroBusca"
          class="form-control"
          [(ngModel)]="filtroBusca"
          (keyup.enter)="aplicarFiltro()"
      />
    </div>
    <div class="col-md-2">
      <button class="btn btn-outline-primary w-100" mdbRipple (click)="aplicarFiltro()">
        Filtrar
      </button>
    </div>
  </div>

  <!-- Lista -->
  <div class="table-responsive">
    <table class="table table-hover align-middle">
      <thead class="table-light">
        <tr>
          <th>Nome</th>
          <th>E-mail</th>
          <th>Perfil</th>
          <th>Cadastrado em</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let usuario of usuarios">
          <td>{{ usuario.name }}</td>
          <td>{{ usuario.email }}</td>
          <td style="min-width: 170px;">
            <select class="form-select form-select-sm"
                    [disabled]="processandoId === usuario.id || ehUsuarioLogado(usuario)"
                    (change)="alterarPerfil(usuario, $event)">
              <option *ngFor="let perfil of perfis" [value]="perfil.valor" [selected]="perfil.valor === usuario.role">
                {{ perfil.rotulo }}
              </option>
            </select>
          </td>
          <td>{{ usuario.createdAt | date:'dd/MM/yyyy HH:mm' }}</td>
          <td>
            <button class="btn btn-sm btn-outline-danger" mdbRipple
                    [disabled]="processandoId === usuario.id || ehUsuarioLogado(usuario)" (click)="excluir(usuario)">
              Excluir
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Loading / vazio -->
  <div class="text-center my-3">
    <div *ngIf="carregando" class="spinner-border text-primary" role="status"></div>
    <p *ngIf="!carregando && usuarios.length === 0" class="text-muted">
      Nenhum usuário encontrado.
    </p>
  </div>
</div>
